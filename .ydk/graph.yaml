version: 1

nodes:
  - id: M-001
    type: mission
    title: Keep project work aligned with its purpose
    statement: >
      ydk exists so maintainers can understand why meaningful project artifacts
      exist and can treat the purpose graph as the desired state of the
      project: code, features, and behavior track the graph, and drift between
      implementation and purpose is made visible and actionable.

  - id: O-001
    type: outcome
    title: Maintainers can explain how current implementation supports project purpose

  - id: O-002
    type: outcome
    title: Maintainers can trust the purpose graph reflects the current repo

  - id: O-003
    type: outcome
    title: Maintainers can steer implementation by changing the graph

  - id: C-001
    type: capability
    title: Resolve implementation artifacts to project intent

  - id: C-002
    type: capability
    title: Keep the purpose mapping trustworthy and complete

  - id: C-003
    type: capability
    title: Make the purpose graph comprehensible

  - id: C-004
    type: capability
    title: Measure how well implementation fulfills each node's stated purpose

  - id: C-005
    type: capability
    title: Measure how coherently each node supports its parent

  - id: F-001
    type: feature
    title: Explain why a repo artifact exists

  - id: F-002
    type: feature
    title: Validate that the current purpose graph reaches the mission

  - id: F-003
    type: feature
    title: Report how much of the repo is anchored to the purpose graph

  - id: F-004
    type: feature
    title: Visualize the purpose graph as a navigable map

  - id: F-005
    type: feature
    title: Report how well anchored artifacts fulfill their purpose nodes

