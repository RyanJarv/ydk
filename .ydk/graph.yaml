version: 1

nodes:
  - id: M-001
    type: mission
    title: Keep project work aligned with its purpose
    statement: >
      ydk exists so maintainers can understand why meaningful project artifacts
      exist and keep code, features, and behavior aligned with the project's
      intended purpose.

  - id: O-001
    type: outcome
    title: Maintainers can explain how current implementation supports project purpose

  - id: O-002
