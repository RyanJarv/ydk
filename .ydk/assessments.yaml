assessments:
  - node: C-001
    score: 3
    assessed: 2026-08-24
    unfulfilled:
      - resolveTarget keeps only the single highest-specificity match and drops the rest, so a file covered by both a file anchor and a directory anchor resolves to the file anchor alone and its second purpose is never reported.
      - loadProject reads .ydk/ from the process working directory alone, and the root option createProjectServer accepts is not exposed by any command, so artifacts in another checkout cannot be resolved without copying a configuration into it.
      - 'docs/MODEL.md lists the fixed validation rules but omits three that `ydk validate` now enforces: duplicate node ids, anchor target kinds no resolver implements, and finding lists that are not lists of strings.'
    undeclared:
      - docs/examples holds four fictional sessions built on commands that do not exist (`ydk show`, `ydk impact`, `ydk review`, `ydk ci`, `ydk propose-anchor`, `ydk which`), which explores future direction rather than resolving artifacts to intent.
      - docs/design-log.md records superseded design history, which docs/MODEL.md itself places outside the current-purpose graph.
      - package.json and tsconfig.json configure how the project runs and type-checks rather than how any artifact resolves to intent.
      - docs/MODEL.md specifies the whole built-in ontology, validation rules, coverage semantics, and assessment format, most of which belongs to nodes other than this one.

  - node: C-002
    score: 1
    assessed: 2026-08-24
    unfulfilled:
      - The only anchored artifact is a point-in-time study of one external repository, so nothing here keeps this repo's mapping trustworthy or complete between studies.
      - 'The study is frozen at bb-private commit c6823c11 on 2026-08-21 and records a status against only one of its six ydk findings, so a reader cannot tell which still stand: its claim that src/graph/types.ts holds a SymbolAnchorTarget is now false, its fulfillment gap has since been answered by assessments, and its external-project-root and directory-summarization findings are still true today.'
      - Nothing anchored to this node measures completeness of the mapping; this repo's 8 of 10 anchored nodes, 33 of 38 anchored files, and two unanchored capabilities are reported only by artifacts anchored to F-003.
    undeclared:
      - docs/onboarding/bb-private/graph.yaml and anchors.yaml are a candidate purpose graph and anchor set for a different repository, kept as a reusable worked example that no node claims.
      - The study also prescribes an eight-step onboarding method and a five-step next-iteration plan, which is process guidance for a future `onboard` command rather than a record of trustworthiness.

  - node: C-003
    score: 3
    assessed: 2026-08-24
    unfulfilled:
      - src/serve/web/index.html mounts an empty div and app.js only reports failures after Vue itself mounts, so the exact fault the onboarding study hit, a vendored runtime that answers 500, leaves a blank page explaining nothing.
      - The app fetches /api/project once on mount and offers no reload, so a graph edited while `ydk serve` is running keeps showing the previous picture until the page is reloaded by hand.
    undeclared:
      - src/serve/projectView.ts recomputes the full coverage report and per-anchor stale status, and server.ts ships validateProject output to the browser, which is work claimed by F-002 and F-003.
      - src/serve/server.ts also acts as a static asset host, resolving and serving a vendored Vue runtime out of ydk's own node_modules.

  - node: F-001
    score: 3
    assessed: 2026-08-24
    unfulfilled:
      - resolveWhy returns the single best-matching anchor and never mentions the others, so an artifact with several legitimate reasons for existing is explained by one of them; --all-paths widens the graph paths from that node, not the set of anchors that matched.
      - '`ydk why` prints only "No explanation found for <path>" and exits 1 when nothing matches, so the five unanchored files in this repo get a bare failure that neither says the file is unanchored nor points at `ydk coverage --unanchored-files`.'
    undeclared:
      - src/cli.ts and the `ydk` package script also implement trace, validate, graph, coverage, and serve, so the behavior of four other nodes is anchored entirely to this feature.
      - src/launcher.ts and the `serve` package script re-exec the CLI under --permission with explicit filesystem and network grants, which is process hardening rather than explaining an artifact.

